<!doctype html>
<!-- Source for the social banners. Rendered to PNG by brand/render.mjs (?size=og | linkedin | logo). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@1&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  html, body { margin: 0; overflow: hidden; }
  .b { position: relative; overflow: hidden; background: var(--paper); display: grid; }
  .og { width: 1200px; height: 630px; grid-template-columns: 1fr 520px; padding: 64px 0 56px 72px; }
  .li { width: 1584px; height: 396px; grid-template-columns: 1fr 580px; gap: 40px; padding: 0 0 0 360px; align-items: center; background: var(--paper-2); }
  .logo-sq { width: 400px; height: 400px; display: grid; place-items: center; background: var(--ink); }
  .brand { display: flex; align-items: center; gap: 14px; font-family: var(--f-head); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .brand img { width: 52px; height: 52px; }
  .brand span { font-weight: 500; color: var(--muted); }
  h1 { font-size: 66px; line-height: 1.02; margin: 36px 0 0; max-width: 640px; }
  .li h1 { font-size: 42px; margin: 0 0 18px; max-width: 640px; }
  .foot { position: absolute; left: 72px; bottom: 52px; display: flex; gap: 20px; font-family: var(--f-head); font-weight: 500; font-size: 17px; color: var(--muted); white-space: nowrap; }
  .foot b { color: var(--ink); }
  .li .sub { font-family: var(--f-head); font-size: 18px; color: var(--muted); display: flex; gap: 22px; white-space: nowrap; }
  .li .sub span::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--gold); border-radius: 2px; transform: rotate(45deg); margin-right: 10px; vertical-align: 2px; }
  .art { position: relative; }
  .og .art { margin: -64px 0 -56px; }
  .art .map { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0; }
  .art .phone { position: absolute; width: 210px; }
  .og .a1 { left: 60px; top: 70px; transform: rotate(-6deg); }
  .og .a2 { left: 270px; top: 150px; transform: rotate(5deg); }
  .li .art { height: 396px; }
  .li .a1 { left: 120px; top: 40px; width: 170px; transform: rotate(-6deg); }
  .li .a2 { left: 330px; top: 90px; width: 170px; transform: rotate(5deg); }
  .li .pattern { position: absolute; left: -40px; bottom: -70px; width: 520px; opacity: .9; }
</style>
</head>
<body>
<div class="b og" id="og">
  <div>
    <div class="brand"><img src="../assets/favicon.svg" alt="">Dollar<span>Technologies</span></div>
    <h1>We build <em>marketplace, delivery and booking</em> apps.</h1>
    <div class="foot"><b>dollartechnologies.com</b><span>Web · Android · iOS</span><span>Navalur, Chennai</span></div>
  </div>
  <div class="art">
    <img class="map" src="../assets/hero-map.svg" alt="">
    <figure class="phone a1"><img src="../assets/zobra/zobra-home.webp" alt=""></figure>
    <figure class="phone a2"><img src="../assets/zobra/zobra-order.webp" alt=""></figure>
  </div>
</div>

<div class="b li" id="linkedin">
  <img class="pattern" src="../assets/pattern.svg" alt="">
  <div>
    <h1>Marketplace, delivery and booking apps <em>for Indian businesses.</em></h1>
    <div class="sub"><span>Websites &amp; web apps</span><span>Android &amp; iOS</span><span>Backend &amp; cloud</span></div>
  </div>
  <div class="art">
    <img class="map" src="../assets/hero-map.svg" alt="">
    <figure class="phone a1"><img src="../assets/zobra/zobra-store.webp" alt=""></figure>
    <figure class="phone a2"><img src="../assets/zobra/zobra-home.webp" alt=""></figure>
  </div>
</div>

<div class="logo-sq" id="logo"><img src="../assets/favicon.svg" alt="" width="260" height="260"></div>
</body>
</html>
