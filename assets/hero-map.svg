<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="Map of a neighbourhood with a store, its delivery radius, a rider and a delivery route">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#CFC6B3"/></pattern>
  </defs>
  <rect width="600" height="560" rx="32" fill="#ECE6D9"/>
  <rect width="600" height="560" rx="32" fill="url(#dots)" opacity=".55"/>
  <!-- lake and park -->
  <path d="M430 40c60 6 120 40 130 96s-40 84-96 74-92-52-96-96 14-80 62-74z" fill="#DCE5D5"/>
  <path d="M40 400c40-18 104-8 126 30s4 92-46 98-102-24-108-62 4-52 28-66z" fill="#E4DBC6"/>
  <!-- minor streets -->
  <g stroke="#F7F3EA" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M0 120H600M0 250H600M0 380H600M0 500H600"/>
    <path d="M110 0V560M250 0V560M390 0V560M520 0V560"/>
  </g>
  <!-- main road (OMR) -->
  <path d="M-20 520L620 60" stroke="#F7F3EA" stroke-width="30" stroke-linecap="round"/>
  <path d="M-20 520L620 60" stroke="#E2A93B" stroke-width="3" stroke-dasharray="14 12" opacity=".7"/>
  <text x="458" y="170" transform="rotate(-35.7 458 170)" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#8A7E68">OMR</text>
  <!-- delivery radius around the store -->
  <circle cx="250" cy="250" r="170" fill="#E2A93B" fill-opacity=".07" stroke="#16130F" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
  <!-- route: store to customer -->
  <path d="M250 250H390V380H470" fill="none" stroke="#16130F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 12"/>
  <!-- rider -->
  <circle cx="390" cy="318" r="15" fill="#E2A93B" fill-opacity=".25"/>
  <circle cx="390" cy="318" r="7" fill="#E2A93B" stroke="#16130F" stroke-width="2.5"/>
  <!-- store pin -->
  <g transform="translate(250 250)">
    <circle r="26" fill="#16130F"/>
    <path d="M-11 -4h22l-2-8h-18zM-9 -4v13h18v-13M-3 9v-7h6v7" fill="none" stroke="#F6F3EC" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <!-- customer pin -->
  <g transform="translate(470 380)">
    <path d="M0 18c-12-14-18-24-18-32a18 18 0 0 1 36 0c0 8-6 18-18 32z" transform="translate(0 -16)" fill="#E2A93B" stroke="#16130F" stroke-width="2.5"/>
    <circle cy="-30" r="6" fill="#16130F"/>
  </g>
  <!-- other stores -->
  <g fill="#F6F3EC" stroke="#16130F" stroke-width="2.5">
    <circle cx="110" cy="120" r="9"/><circle cx="520" cy="250" r="9"/><circle cx="250" cy="500" r="9"/>
  </g>
</svg>
